<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলা আইপি টিভি</title>
    <!-- HLS.js for streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f111a;
            color: #ffffff;
            padding-bottom: 30px;
        }
        /* Header Style */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background-color: #1a1d29;
            border-bottom: 1px solid #2a2e3d;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .site-title {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
        }
        .site-title .highlight {
            color: #00ffcc;
        }
        .live-badge {
            background-color: #e50914;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .live-dot {
            width: 7px;
            height: 7px;
            background-color: white;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* Video Player Section */
        .player-container {
            width: 100%;
            background-color: #000;
            position: relative;
            aspect-ratio: 16/9;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .current-channel-name {
            padding: 8px 15px;
            background: #141722;
            font-size: 15px;
            color: #ffcc00;
            font-weight: 500;
        }

        /* Search & Categories */
        .controls-container {
            padding: 12px 15px;
        }
        .search-box {
            width: 100%;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #2a2e3d;
            background-color: #1a1d29;
            color: white;
            font-size: 14px;
            outline: none;
            margin-bottom: 12px;
        }
        .search-box::placeholder {
            color: #888;
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar {
            display: none;
        }
        .cat-btn {
            background-color: #1a1d29;
            color: #ccc;
            border: 1px solid #2a2e3d;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.3s;
        }
        .cat-btn.active, .cat-btn:hover {
            background-color: #00ffcc;
            color: #000;
            font-weight: bold;
            border-color: #00ffcc;
        }

        /* Section Title */
        .section-title {
            padding: 10px 15px;
            font-size: 16px;
            font-weight: bold;
            color: #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Channel Grid */
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 0 15px;
        }
        @media (max-width: 600px) {
            .channel-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        .channel-card {
            background-color: #1a1d29;
            border: 1px solid #2a2e3d;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            position: relative;
        }
        .channel-card:active {
            transform: scale(0.95);
        }
        .channel-card.active-channel {
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }
        .channel-logo-wrap {
            width: 100%;
            height: 70px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }
        .channel-logo-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .channel-name {
            font-size: 11px;
            padding: 6px 4px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>

        ];

        function loadChannels(filteredChannels) {
            const grid = document.getElementById('channelGrid');
            grid.innerHTML = "";
            filteredChannels.forEach((channel) => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.onclick = () => playChannel(channel, card);
                card.innerHTML = `
                    <div class="channel-logo-wrap">
                        <img src="${channel.logo}" alt="${channel.name}">
                    </div>
                    <div class="channel-name">${channel.name}</div>
                `;
                grid.appendChild(card);
            });
        }

        function playChannel(channel, element) {
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active-channel'));
            element.classList.add('active-channel');
            document.getElementById('currentChannelText').innerText = "প্লে হচ্ছে: " + channel.name;

            const video = document.getElementById('video');
            if (Hls.isSupported() && channel.url.includes('.m3u8')) {
                const hls = new Hls();
                hls.loadSource(channel.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else {
                video.src = channel.url;
                video.play();
            }
        }

        function filterCategory(category, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (category === 'all') {
                loadChannels(channels);
            } else {
                const filtered = channels.filter(c => c.category === category);
                loadChannels(filtered);
            }
        }

        function filterChannels() {
            let query = document.getElementById('searchBox').value.toLowerCase();
            let filtered = channels.filter(c => c.name.toLowerCase().includes(query));
            loadChannels(filtered);
        }

        // প্রথমে সব চ্যানেল লোড করুন
        loadChannels(channels);
