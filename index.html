<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Bangla IP TV - Live IP TV Streaming</title>
    <!-- Clappr Video Player CDN -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0f19; color: #f1f5f9; overflow-x: hidden; }

        /* Top Navigation Bar */
        .navbar { background-color: #111827; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 20px; font-weight: bold; color: #ef4444; display: flex; align-items: center; gap: 8px; }
        .logo span { color: #fff; }
        .live-tag { background: #ef4444; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .live-tag i { font-size: 8px; animation: blink 1s infinite; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Main Container Layout */
        .app-container { display: flex; height: calc(100vh - 57px); }
        @media (max-width: 900px) {
            .app-container { flex-direction: column; height: auto; }
        }

        /* Video Player Area */
        .player-area { flex: 1; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; min-height: 400px; }
        #player { width: 100%; height: 100%; }
        .channel-title-bar { position: absolute; top: 15px; left: 15px; background: rgba(0, 0, 0, 0.75); padding: 6px 14px; border-radius: 6px; font-size: 14px; border-left: 3px solid #ef4444; z-index: 10; backdrop-filter: blur(5px); }

        /* Sidebar Channel Section */
        .sidebar-area { width: 350px; background-color: #111827; display: flex; flex-direction: column; border-left: 1px solid #1f2937; }
        @media (max-width: 900px) {
            .sidebar-area { width: 100%; height: 450px; }
        }

        .sidebar-heading { padding: 15px; font-size: 15px; font-weight: 600; background: #1f2937; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        
        .search-container { padding: 12px; background: #111827; }
        .search-container input { width: 100%; padding: 10px 14px; background: #1f2937; border: 1px solid #374151; border-radius: 6px; color: #fff; outline: none; font-size: 14px; }
        .search-container input:focus { border-color: #ef4444; }

        /* Channel List Container */
        .channel-list { flex: 1; overflow-y: auto; padding: 10px; }
        .channel-card { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-bottom: 8px; background: #1f2937; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; border: 1px solid transparent; }
        .channel-card:hover { background: #374151; border-color: #4b5563; }
        .channel-card.active { background: #ef4444; color: #fff; border-color: #f87171; }
        
        .channel-logo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #fff; padding: 2px; }
        .channel-details h4 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
        .channel-details span { font-size: 11px; opacity: 0.8; }
        .channel-card.active .channel-details span { opacity: 0.9; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="logo"><i class="fa-solid fa-tv" style="color: #ef4444;"></i> Bangla IP <span>TV</span></div>
        <div class="live-tag"><i class="fa-solid fa-circle"></i> LIVE STREAM</div>
    </div>

    <!-- Main Container -->
    <div class="app-container">
        
        <!-- Player Section -->
        <div class="player-area">
            <div class="channel-title-bar" id="currentChannelName">চ্যানেল লোড হচ্ছে...</div>
            <div id="player"></div>
        </div>

        <!-- Sidebar Section -->
        <div class="sidebar-area">
            <div class="sidebar-heading">
                <span>লাইভ টিভি চ্যানেলসমূহ</span>
                <i class="fa-solid fa-list-ul"></i>
            </div>
            <div class="search-container">
                <input type="text" id="searchBox" placeholder="চ্যানেল খুঁজুন..." onkeyup="searchChannel()">
            </div>
            <div class="channel-list" id="channelListBox">
                <!-- ডায়নামিক চ্যানেল লিস্ট এখানে রেন্ডার হবে -->
            </div>
        </div>

    </div>

    <script>
        // আপনার দেওয়া প্লেলিস্ট থেকে সঠিক ও কার্যকর চ্যানেল লিংকগুলোর ডেটাসেট
        const channelsData = [
            { name: "সময় নিউজ টিভি (Somoy News)", category: "News", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1702/output/index.m3u8", logo: "https://i.ibb.co/5Gz1VjV/somoy.png" },
            { name: "টি স্পোর্টস (T Sports)", category: "Sports", url: "https://tvsen7.aynaott.com/tsports-hd/index.m3u8", logo: "https://i.ibb.co/tsports.png" },
            { name: "ইনডিপেন্ডেন্ট টিভি", category: "News", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1704/output/1704.m3u8", logo: "https://i.ibb.co/3s8Z12K/independent.png" },
            { name: "চ্যানেল ২৪ (Channel 24)", category: "News", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1703/output/index.m3u8", logo: "https://i.ibb.co/channel24.png" },
            { name: "একাত্তর টিভি (Ekattor TV)", category: "News", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1705/output/1705.m3u8", logo: "https://i.ibb.co/99Z99Z9/ekattor.png" },
            { name: "চ্যানেল আই (Channel i)", category: "Entertainment", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1723/output/index.m3u8", logo: "https://i.ibb.co/4p3K28V/channeli.png" },
            { name: "এনটিভি (NTV)", category: "Entertainment", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1716/output/index.m3u8", logo: "https://i.ibb.co/ntv.png" },
            { name: "আরটিভি (RTV)", category: "Entertainment", url: "https://tvsen5.aynaott.com/RtvHD/index.m3u8", logo: "https://i.ibb.co/rtv.png" },
            { name: "বাংলাভিশন (Bangla Vision)", category: "Entertainment", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1715/output/index.m3u8", logo: "https://i.ibb.co/banglavision.png" },
            { name: "ডিবিসি নিউজ (DBC News)", category: "News", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1728/output/index.m3u8", logo: "https://i.ibb.co/dbc.png" },
            { name: "নিউজ ২৪ (News 24)", category: "News", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1708/output/1708.m3u8", logo: "https://i.ibb.co/news24.png" },
            { name: "এএখন টিভি (Ekhon TV)", category: "News", url: "https://tplay.live/out/bangladesh/ekhontv.index.m3u8", logo: "https://i.ibb.co/ekhon.png" },
            { name: "দীপ্ত টিভি (Deepto TV)", category: "Entertainment", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1711/output/index.m3u8", logo: "https://i.ibb.co/88X88X8/deepto.png" },
            { name: "মাছরাঙা টিভি (Maasranga)", category: "Entertainment", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1722/output/index.m3u8", logo: "https://i.ibb.co/maasranga.png" },
            { name: "বিটিভি ন্যাশনাল (BTV)", category: "Government", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1709/output/1709.m3u8", logo: "https://i.ibb.co/btv.png" },
            { name: "জিটিভি (GTV)", category: "Sports", url: "https://tvsen5.aynaott.com/Ravc7gPCZpxk/index.m3u8", logo: "https://i.ibb.co/0V88x2c/gtv.png" },
            { name: "দুরন্ত টিভি (Duronto TV)", category: "Kids", url: "https://tvsen5.aynaott.com/durontotv/index.m3u8", logo: "https://i.ibb.co/duronto.png" },
            { name: "এটিএন নিউজ (ATN News)", category: "News", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1706/output/1706.m3u8", logo: "https://i.ibb.co/atnnews.png" },
            { name: "এশিয়ান টিভি (Asian TV)", category: "Entertainment", url: "https://tvsen6.aynaott.com/asiantv/index.m3u8", logo: "https://i.ibb.co/asiantv.png" },
            { name: "বৈশাখী টিভি (Boishakhi TV)", category: "Entertainment", url: "https://tvsen6.aynaott.com/boishakhitv/index.m3u8", logo: "https://i.ibb.co/boishakhi.png" },
            { name: "মোহনা টিভি (Mohona TV)", category: "Entertainment", url: "https://tvsen6.aynaott.com/mohonatv/index.m3u8", logo: "https://i.ibb.co/mohonatv.png" },
            { name: "মাই টিভি (My TV)", category: "Entertainment", url: "https://tvsen6.aynaott.com/mytv/index.m3u8", logo: "https://i.ibb.co/mytv.png" },
            { name: "জিটিভি বা অন্যান্য (AynaOtt HD)", category: "Sports", url: "https://tvsen5.aynaott.com/TnMn5kZz8aLm/index.m3u8", logo: "https://i.ibb.co/tsports.png" }
        ];

        let playerInstance = null;

        function renderChannels(list) {
            const box = document.getElementById('channelListBox');
            box.innerHTML = '';

            if(list.length === 0) {
                box.innerHTML = '<p style="text-align:center; color:#9ca3af; margin-top:20px; font-size:13px;">কোনো চ্যানেল পাওয়া যায়নি</p>';
                return;
            }

            list.forEach((channel, index) => {
                const card = document.createElement('div');
                card.className = `channel-card ${index === 0 && list === channelsData ? 'active' : ''}`;
                card.onclick = () => {
                    document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    playChannel(channel);
                };

                card.innerHTML = `
                    <img src="${channel.logo}" class="channel-logo" onerror="this.src='https://via.placeholder.com/40'">
                    <div class="channel-details">
                        <h4>${channel.name}</h4>
                        <span>${channel.category}</span>
                    </div>
                `;
                box.appendChild(card);
            });
        }

        function playChannel(channel) {
            document.getElementById('currentChannelName').innerText = channel.name;

            if (playerInstance) {
                playerInstance.destroy();
                playerInstance = null;
            }

            const playerContainer = document.getElementById('player');
            playerContainer.innerHTML = '';

            playerInstance = new Clappr.Player({
                source: channel.url,
                parentId: "#player",
                autoPlay: true,
                width: '100%',
                height: '100%',
                mediacontrol: { seekbar: "#ef4444", buttons: "#ef4444" }
            });
        }

        function searchChannel() {
            let query = document.getElementById('searchBox').value.toLowerCase();
            let filtered = channelsData.filter(ch => ch.name.toLowerCase().includes(query));
            renderChannels(filtered);
        }

        window.onload = () => {
            renderChannels(channelsData);
            if(channelsData.length > 0) {
                playChannel(channelsData[0]);
            }
        };
    </script>
</body>
</html>
